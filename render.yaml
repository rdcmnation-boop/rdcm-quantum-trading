# IMPORTANTE: los `plan:` de abajo son los del Blueprint. Verifica en el panel de Render que el servicio web y la base de datos estén en un plan de pago
# (la base gratuita de Render caduca; el servicio gratuito se duerme). Cambiar un plan aquí y sincronizar el Blueprint cambia la facturación.
services:
  - type: web
    name: quantum-trading
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quantum-trading-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false

databases:
  - name: quantum-trading-db
    databaseName: quantum_trading
    user: qtrade_user
    region: ohio
    plan: free
