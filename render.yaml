services:
  - type: web
    name: quantum-trading
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quantum-trading-db
          property: connectionString

databases:
  - name: quantum-trading-db
    databaseName: quantum_trading
    user: qtrade_user
    region: ohio
    plan: free
