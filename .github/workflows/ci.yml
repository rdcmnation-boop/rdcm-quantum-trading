name: ci
on: { push: { branches: [quantum-trading, v3-brain] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [20, 22] } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: qt }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Integración con Postgres real (borra las tablas de esta base desechable)
        run: npm run test:pg
        env: { TEST_DATABASE_URL: 'postgres://postgres:test@localhost:5432/qt' }
      - name: Escaneo de dependencias (solo producción)
        run: npm audit --omit=dev --audit-level=high
