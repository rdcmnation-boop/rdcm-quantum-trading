<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RDCMNATION QUANTUM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: #1a1f2e;
            border: 2px solid #667eea;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 12px;
            color: #999;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #2d3748;
            background: #0f1419;
            color: #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            margin: 20px 0;
            color: #2d3748;
            font-size: 12px;
        }

        .signup-link {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-radius: 50%;
            border-top: 2px solid transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #2d3748;
            font-size: 11px;
            color: #999;
            text-align: left;
        }

        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .feature-icon {
            width: 20px;
            height: 20px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            font-size: 10px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo">⚡ RDCMNATION QUANTUM</div>
            <div class="tagline">AI-Powered Trading Platform</div>

            <div id="alert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    🔐 Sign In
                </button>
            </form>

            <div class="divider">or</div>

            <div class="signup-link">
                Don't have an account? <a href="#" onclick="switchToSignup(event)">Create one now</a>
            </div>

            <!-- Signup Form (Hidden) -->
            <form id="signupForm" style="display: none;" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn" id="signupBtn">
                    🚀 Create Account
                </button>
            </form>

            <div class="signup-link" id="backToLogin" style="display: none; margin-top: 20px;">
                Already have an account? <a href="#" onclick="switchToLogin(event)">Sign in here</a>
            </div>

            <!-- Features List -->
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">✅</div>
                    <span>4 AI Trading Bots</span>
                </div>
                <div class="feature">
                    <div class="feature-icon">✅</div>
                    <span>67.3% Win Rate</span>
                </div>
                <div class="feature">
                    <div class="feature-icon">✅</div>
                    <span>Robinhood & Coinbase</span>
                </div>
                <div class="feature">
                    <div class="feature-icon">✅</div>
                    <span>Real Money Trading</span>
                </div>
                <div class="feature">
                    <div class="feature-icon">✅</div>
                    <span>24/7 Support</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span>Signing in...';

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    window.location.href = 'dashboard.html';
                } else {
                    showAlert('❌ ' + data.error, 'error');
                    btn.disabled = false;
                    btn.textContent = '🔐 Sign In';
                }
            })
            .catch(err => {
                showAlert('❌ Connection error: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = '🔐 Sign In';
            });
        }

        function handleSignup(event) {
            event.preventDefault();
            const full_name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const btn = document.getElementById('signupBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span>Creating account...';

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name, email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    window.location.href = 'dashboard.html';
                } else {
                    showAlert('❌ ' + data.error, 'error');
                    btn.disabled = false;
                    btn.textContent = '🚀 Create Account';
                }
            })
            .catch(err => {
                showAlert('❌ Connection error: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = '🚀 Create Account';
            });
        }

        function switchToSignup(event) {
            event.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
            document.getElementById('backToLogin').style.display = 'block';
            document.getElementById('alert').innerHTML = '';
        }

        function switchToLogin(event) {
            event.preventDefault();
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('backToLogin').style.display = 'none';
            document.getElementById('alert').innerHTML = '';
        }

        function showAlert(message, type) {
            document.getElementById('alert').innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        // Check if already logged in
        if (localStorage.getItem('authToken')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
