<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDCMNATION QUANTUM - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(26, 31, 46, 0.95);
            border: 2px solid #667eea;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.2);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #2d3748;
            background: #0f1419;
            color: #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.3);
            background: #1a1f2e;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #2d3748;
            color: #e0e0e0;
            border: 1px solid #667eea;
        }

        .btn-secondary:hover {
            background: #3d4758;
            color: #667eea;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border-left: 3px solid #e74c3c;
            display: none;
        }

        .alert-error.show {
            display: block;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            border-left: 3px solid #4caf50;
            display: none;
        }

        .alert-success.show {
            display: block;
        }

        .dev-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
        }

        .dev-link a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }

        .dev-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-radius: 50%;
            border-top: 2px solid transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 30px 20px;
            }

            .title {
                font-size: 22px;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">⚡</div>
            <div class="title">RDCMNATION QUANTUM</div>
            <div class="subtitle">AI-Powered Trading Platform</div>
        </div>

        <div id="alert-error" class="alert alert-error"></div>
        <div id="alert-success" class="alert alert-success"></div>

        <!-- Login Form -->
        <form id="login-form" style="display: block;">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">🔓 Login</button>
                <button type="button" class="btn btn-secondary" onclick="switchToRegister()">📝 Register</button>
            </div>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="register-form" style="display: none;">
            <div class="form-group">
                <label for="register-name">Full Name</label>
                <input type="text" id="register-name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="register-password">Password</label>
                <input type="password" id="register-password" placeholder="••••••••" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">✅ Register</button>
                <button type="button" class="btn btn-secondary" onclick="switchToLogin()">🔓 Back to Login</button>
            </div>
        </form>

        <div class="dev-link">
            <a href="dev.html">👨‍💻 Developer Portal</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        function switchToRegister() {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            clearAlerts();
        }

        function switchToLogin() {
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
            clearAlerts();
        }

        function clearAlerts() {
            document.getElementById('alert-error').classList.remove('show');
            document.getElementById('alert-success').classList.remove('show');
        }

        function showAlert(message, type = 'error') {
            const alertId = type === 'error' ? 'alert-error' : 'alert-success';
            const alert = document.getElementById(alertId);
            alert.textContent = message;
            alert.classList.add('show');
            setTimeout(() => alert.classList.remove('show'), 5000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const btn = loginForm.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.innerHTML = '<span class="loading"></span> Logging in...';

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    showAlert('✅ Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showAlert('❌ ' + (data.error || 'Login failed'), 'error');
                    btn.disabled = false;
                    btn.innerHTML = '🔓 Login';
                }
            } catch (error) {
                showAlert('❌ Connection error: ' + error.message, 'error');
                loginForm.querySelector('button[type="submit"]').disabled = false;
                loginForm.querySelector('button[type="submit"]').innerHTML = '🔓 Login';
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            if (password.length < 6) {
                showAlert('❌ Password must be at least 6 characters', 'error');
                return;
            }

            try {
                const btn = registerForm.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.innerHTML = '<span class="loading"></span> Creating account...';

                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, full_name })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    showAlert('✅ Account created! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showAlert('❌ ' + (data.error || 'Registration failed'), 'error');
                    btn.disabled = false;
                    btn.innerHTML = '✅ Register';
                }
            } catch (error) {
                showAlert('❌ Connection error: ' + error.message, 'error');
                registerForm.querySelector('button[type="submit"]').disabled = false;
                registerForm.querySelector('button[type="submit"]').innerHTML = '✅ Register';
            }
        });

        window.addEventListener('load', () => {
            const token = localStorage.getItem('authToken');
            if (token) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
